name: 読み上げ音声だけ作る（tools/voice）

# tools/voice/<名前>.json を置く（更新する）と、VOICEVOX で全セリフの音声を作り、
# Actions の成果物（Artifacts）と、voice-out ブランチの <名前>/ に置く。動画は作らない。
on:
  push:
    paths:
      - "tools/voice/*.json"
  workflow_dispatch:
    inputs:
      file:
        description: "tools/voice/ の JSON ファイル名（例 dotjp.json）"
        required: true

permissions:
  contents: write

jobs:
  voice:
    runs-on: ubuntu-latest
    services:
      voicevox:
        image: voicevox/voicevox_engine:cpu-latest
        ports:
          - 50021:50021
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: VOICEVOX の起動を待つ
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:50021/version && exit 0
            sleep 3
          done
          echo "VOICEVOX が起動しませんでした" && exit 1
      - name: 対象の JSON を決める
        id: f
        run: |
          if [ -n "${{ github.event.inputs.file }}" ]; then
            F="tools/voice/${{ github.event.inputs.file }}"
          else
            F=$(git diff --name-only HEAD~1 HEAD | grep -E '^tools/voice/[^/]+\.json$' | head -1)
          fi
          echo "file=$F" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$F" .json)" >> "$GITHUB_OUTPUT"
      - name: 音声を作る
        run: python3 tools/voice/synth.py "${{ steps.f.outputs.file }}"
      - uses: actions/upload-artifact@v4
        with:
          name: voice-${{ steps.f.outputs.name }}
          path: out/voice/${{ steps.f.outputs.name }}
          retention-days: 14
      - name: voice-out ブランチにも置く（main は汚さない）
        run: |
          N="${{ steps.f.outputs.name }}"
          mkdir -p /tmp/vo && cp -r "out/voice/$N" /tmp/vo/
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan voice-out
          git rm -rfq . && git clean -fdq
          cp -r /tmp/vo/* .
          git add -A && git commit -qm "読み上げ音声: $N"
          git push -f origin voice-out
